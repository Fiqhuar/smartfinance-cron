name: Daily NCR Data Update

on:
  schedule:
    - cron: '8 6 * * *'  # 06:08 UTC = 12:08 PM IST daily
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check time zones
        run: |
          echo "UTC Time: $(date -u)"
          echo "IST Time: $(TZ='Asia/Kolkata' date)"
      
      - name: Trigger PHP Script
        run: |
          curl -X GET "https://smartfinance.in/data_update/ncr_autodataupdate.php?key=${{ secrets.CRON_KEY }}" \
            --max-time 120 \
            --retry 2
          
          echo "✅ Daily update completed"
